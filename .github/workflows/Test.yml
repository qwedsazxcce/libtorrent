name: Build libtorrent-rasterbar 2.0.12 (Full Feature Static Library)

on:
  push:
    branches: [RC_2_0]
    paths: ['.github/workflows/Test.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      LIBTORRENT_VERSION: 2.0.12
      WORK_DIR: ${{ github.workspace }}\libtorrent-work
      VCPKG_VERSION: 2026-03-04

    steps:
      # 1. 下载vcpkg.exe + bundle配置 + 极简合规的vcpkg-configuration.json
      - name: Setup complete vcpkg environment
        shell: powershell
        run: |
          # 创建vcpkg目录
          New-Item -Path $env:VCPKG_ROOT -ItemType Directory -Force | Out-Null
          Set-Location $env:VCPKG_ROOT

          # 下载指定的vcpkg.exe
          $vcpkgExeUrl = "https://github.com/microsoft/vcpkg-tool/releases/download/$env:VCPKG_VERSION/vcpkg.exe"
          Invoke-WebRequest -Uri $vcpkgExeUrl -OutFile vcpkg.exe -UseBasicParsing -TimeoutSec 60
          Write-Host "✅ vcpkg.exe downloaded (size: $(Get-Item vcpkg.exe).Length / 1MB MB)"

          # 下载bundle配置包
          $bundleUrl = "https://github.com/microsoft/vcpkg-tool/releases/download/$env:VCPKG_VERSION/vcpkg-standalone-bundle.tar.gz"
          Invoke-WebRequest -Uri $bundleUrl -OutFile vcpkg-bundle.tar.gz -UseBasicParsing -TimeoutSec 120
          tar -xzf vcpkg-bundle.tar.gz
          Remove-Item vcpkg-bundle.tar.gz -Force

          # 终极简化：仅保留builtin-baseline（满足vcpkg 2026强制要求，无多余字段）
          $vcpkgConfig = '{
            "builtin-baseline": "7e74653e3f7b123e9e9b224d99e49f0936268c8f"
          }'
          $vcpkgConfig | Out-File -FilePath "vcpkg-configuration.json" -Encoding utf8
          Write-Host "✅ vcpkg-configuration.json created (minimal & compliant)"

          # 验证vcpkg配置解析
          .\vcpkg.exe --debug version
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Error: vcpkg configuration parse failed!"
              exit 1
          }

      # 2. 安装Boost二进制包（只读源，无任何错误）
      - name: Install Boost (binary only, read-only source)
        run: |
          cd /d "%VCPKG_ROOT%"
          :: 只读二进制源，禁用统计，避免干扰
          set VCPKG_FEATURE_FLAGS=binaries
          set VCPKG_BINARY_SOURCES=clear;nuget,https://aka.ms/vcpkg-default-binarysource,read
          set VCPKG_DISABLE_METRICS=1

          echo "=== Installing Boost x64-windows-static (binary) ==="
          :: 直接安装，vcpkg已能识别包和triplet
          .\vcpkg.exe install boost-asio:x64-windows-static boost-chrono:x64-windows-static boost-system:x64-windows-static boost-thread:x64-windows-static boost-random:x64-windows-static boost-regex:x64-windows-static boost-filesystem:x64-windows-static

          if %errorlevel% neq 0 (
              echo Error: Boost install failed!
              exit 1
          )
          echo "✅ Boost binaries installed successfully!"

      # 3. 下载libtorrent源码（镜像源兜底）
      - name: Download libtorrent source
        shell: powershell
        run: |
          New-Item -Path $env:WORK_DIR -ItemType Directory -Force | Out-Null
          Set-Location $env:WORK_DIR
          
          $url = "https://ghproxy.com/https://github.com/arvidn/libtorrent/releases/download/v$env:LIBTORRENT_VERSION/libtorrent-rasterbar-$env:LIBTORRENT_VERSION.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile libtorrent.tar.gz -UseBasicParsing
          tar -xzf libtorrent.tar.gz
          Write-Host "✅ Libtorrent source downloaded!"

      # 4. CMake配置（全功能静态库）
      - name: Configure CMake
        run: |
          set SRC_DIR=%WORK_DIR%\libtorrent-rasterbar-%LIBTORRENT_VERSION%
          set BUILD_DIR=%SRC_DIR%\build
          mkdir "%BUILD_DIR%" && cd /d "%BUILD_DIR%"
          
          cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
          -DVCPKG_TARGET_TRIPLET=x64-windows-static ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DTORRENT_BUILD_SHARED=OFF ^
          -DTORRENT_USE_DHT=ON ^
          -DTORRENT_USE_ENCRYPTION=ON ^
          -DTORRENT_USE_IPV6=ON ^
          -DTORRENT_USE_UPNP=ON ^
          -DTORRENT_USE_WEBSEEDS=ON

      # 5. 编译libtorrent（自动找MSBuild）
      - name: Build libtorrent
        run: |
          set BUILD_DIR=%WORK_DIR%\libtorrent-rasterbar-%LIBTORRENT_VERSION%\build
          cd /d "%BUILD_DIR%"
          
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe"`) do set MSBUILD=%%i
          "%MSBUILD%" libtorrent.s

name: Build libtorrent-rasterbar 2.0.12 (Full Feature Static Library)

on:
  push:
    branches: [RC_2_0]
    paths: ['.github/workflows/Test.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
    env:
      # 核心环境变量（仅保留必要）
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_TARGET_TRIPLET: x64-windows-static
      LIBTORRENT_VERSION: 2.0.12
      WORK_DIR: ${{ github.workspace }}\libtorrent-work

    steps:
      # 1. 基础环境信息（可选，用于调试）
      - name: Show basic environment info
        run: |
          echo "=== CMake Version ==="
          cmake --version
          echo.
          echo "=== GitHub Workspace ==="
          echo %GITHUB_WORKSPACE%

      # 2. 缓存vcpkg二进制依赖（避免重复下载）
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}\installed
            ${{ env.VCPKG_ROOT }}\binarycache
          key: windows-vcpkg-boost-x64-static-1.90.0
          restore-keys: windows-vcpkg-boost-x64-static-

      # 3. 安装vcpkg工具（二进制）+ Boost二进制包（核心步骤）
      - name: Install vcpkg and Boost (binary only)
        run: |
          :: 1. 下载vcpkg二进制工具（无需克隆源码）
          if not exist "%VCPKG_ROOT%" mkdir "%VCPKG_ROOT%"
          cd /d "%VCPKG_ROOT%"
          curl -L https://github.com/microsoft/vcpkg/releases/latest/download/vcpkg.exe -o vcpkg.exe
          
          :: 2. 强制vcpkg仅使用二进制包（禁止源码编译）
          set VCPKG_FEATURE_FLAGS=binaries
          set VCPKG_BINARY_SOURCES=clear;nuget,https://aka.ms/vcpkg-default-binarysource,readwrite
          
          :: 3. 安装Boost核心组件（仅二进制，秒级完成）
          echo "=== Install Boost binaries ==="
          vcpkg install ^
            boost-asio:%VCPKG_TARGET_TRIPLET% ^
            boost-chrono:%VCPKG_TARGET_TRIPLET% ^
            boost-system:%VCPKG_TARGET_TRIPLET% ^
            boost-thread:%VCPKG_TARGET_TRIPLET% ^
            boost-random:%VCPKG_TARGET_TRIPLET% ^
            boost-regex:%VCPKG_TARGET_TRIPLET% ^
            boost-filesystem:%VCPKG_TARGET_TRIPLET%

      # 4. 下载libtorrent源码（多镜像兜底）
      - name: Download libtorrent source code
        shell: powershell
        run: |
          # 创建工作目录
          New-Item -Path $env:WORK_DIR -ItemType Directory -Force | Out-Null
          Set-Location $env:WORK_DIR
          
          # 多镜像源（优先官方，失败自动切镜像）
          $mirrors = @(
            "https://github.com/arvidn/libtorrent/releases/download/v$env:LIBTORRENT_VERSION/libtorrent-rasterbar-$env:LIBTORRENT_VERSION.tar.gz",
            "https://ghproxy.com/https://github.com/arvidn/libtorrent/releases/download/v$env:LIBTORRENT_VERSION/libtorrent-rasterbar-$env:LIBTORRENT_VERSION.tar.gz"
          )
          
          # 下载逻辑（带重试）
          $output = "libtorrent.tar.gz"
          foreach ($url in $mirrors) {
              try {
                  Write-Host "Download from: $url"
                  Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing -TimeoutSec 60
                  tar -xzf $output
                  Write-Host "Download & extract success!"
                  break
              } catch {
                  Write-Host "Failed to download from $url"
              }
          }

      # 5. CMake配置（全功能静态库）
      - name: Configure CMake (Full Feature)
        run: |
          set SRC_DIR=%WORK_DIR%\libtorrent-rasterbar-%LIBTORRENT_VERSION%
          set BUILD_DIR=%SRC_DIR%\build
          mkdir "%BUILD_DIR%" && cd /d "%BUILD_DIR%"
          
          echo "=== Configure CMake ==="
          cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
          -DVCPKG_TARGET_TRIPLET=%VCPKG_TARGET_TRIPLET% ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DTORRENT_BUILD_SHARED=OFF ^
          -DTORRENT_BUILD_TESTS=OFF ^
          -DTORRENT_BUILD_EXAMPLES=OFF ^
          # 全功能核心参数
          -DTORRENT_USE_DHT=ON ^
          -DTORRENT_USE_ENCRYPTION=ON ^
          -DTORRENT_USE_IPV6=ON ^
          -DTORRENT_USE_UPNP=ON ^
          -DTORRENT_USE_WEBSEEDS=ON ^
          -DTORRENT_USE_SUPER_SEEDING=ON ^
          -DTORRENT_USE_PROXY=ON ^
          -DTORRENT_USE_DISK_CACHE=ON

      # 6. 编译（用vswhere自动找MSBuild，通用无硬编码）
      - name: Build libtorrent (Full Feature Static Library)
        run: |
          set BUILD_DIR=%WORK_DIR%\libtorrent-rasterbar-%LIBTORRENT_VERSION%\build
          cd /d "%BUILD_DIR%"
          
          :: 核心：用vswhere自动查找MSBuild路径（适配所有VS版本）
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe"`) do set MSBUILD_EXE=%%i
          echo "=== Using MSBuild: %MSBUILD_EXE% ==="
          
          :: 编译Release x64（多核编译，速度最快）
          "%MSBUILD_EXE%" libtorrent.sln /p:Configuration=Release /p:Platform=x64 /m /p:WholeProgramOptimization=true

      # 7. 收集产物（libtorrent + Boost 头文件/库，开箱即用）
      - name: Collect build artifacts
        run: |
          set DIST_DIR=%WORK_DIR%\dist
          mkdir "%DIST_DIR%\include" && mkdir "%DIST_DIR%\lib"
          
          :: 复制libtorrent头文件和库
          xcopy /E /I /Y "%WORK_DIR%\libtorrent-rasterbar-%LIBTORRENT_VERSION%\include" "%DIST_DIR%\include"
          copy /Y "%WORK_DIR%\libtorrent-rasterbar-%LIBTORRENT_VERSION%\build\src\Release\libtorrent-rasterbar.lib" "%DIST_DIR%\lib\"
          
          :: 复制Boost头文件和库（无需单独找，直接从vcpkg目录复制）
          xcopy /E /I /Y "%VCPKG_ROOT%\installed\%VCPKG_TARGET_TRIPLET%\include" "%DIST_DIR%\include"
          xcopy /E /I /Y "%VCPKG_ROOT%\installed\%VCPKG_TARGET_TRIPLET%\lib" "%DIST_DIR%\lib"
          
          :: 显示产物目录（验证）
          echo "=== Final Artifacts ==="
          dir /s "%DIST_DIR%"

      # 8. 上传产物（可下载使用）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libtorrent-2.0.12-full-feature-static-x64-windows
          path: ${{ env.WORK_DIR }}\dist\
          retention-days: 30

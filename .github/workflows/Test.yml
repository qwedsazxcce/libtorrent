name: Build libtorrent-rasterbar 2.0.12 (Full Feature Static Library)

on:
  push:
    branches:
      - main  # 仅在推送到 main 分支时触发
    paths:
      - '.github/workflows/Test.yml'  # 仅当这个文件变化时触发
  workflow_dispatch:  # 同时保留手动触发

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd

    steps:
      - name: 显示环境信息
        run: |
          echo "=== 检查 CMake 版本 ==="
          cmake --version
          echo.
          echo "=== 检查 MSBuild 版本 ==="
          msbuild -version
          echo.
          echo "=== 当前工作目录 ==="
          cd

      - name: 安装 vcpkg 并下载 Boost
        run: |
          :: 克隆 vcpkg
          cd /d D:\
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          
          :: 引导 vcpkg
          call bootstrap-vcpkg.bat
          
          :: 安装 Boost（x64-windows-static 版本，适配静态库）
          echo "正在安装 Boost（x64-windows-static），这可能需要 5-10 分钟..."
          .\vcpkg install boost:x64-windows-static
          
          :: 设置 vcpkg 工具链路径
          echo VCPKG_ROOT=D:\vcpkg >> %GITHUB_ENV%
          echo VCPKG_TOOLCHAIN=D:\vcpkg\scripts\buildsystems\vcpkg.cmake >> %GITHUB_ENV%

      - name: 创建工作目录并下载源码
        run: |
          mkdir D:\libtorrent-work
          cd /d D:\libtorrent-work
          
          :: 下载源码
          echo "正在下载 libtorrent 源码..."
          powershell -Command "Invoke-WebRequest -Uri 'https://github.com/arvidn/libtorrent/releases/download/v2.0.12/libtorrent-rasterbar-2.0.12.tar.gz' -OutFile 'libtorrent.tar.gz'"
          
          :: 解压源码
          echo "正在解压源码..."
          tar -xzf libtorrent.tar.gz
          
          dir

      - name: 配置 CMake（修复 Boost 查找 + 全功能静态库）
        run: |
          cd /d D:\libtorrent-work\libtorrent-rasterbar-2.0.12
          mkdir build
          cd build
          
          :: CMake 配置：
          :: 1. 使用 vcpkg 工具链自动找到 Boost
          :: 2. 设置 CMake 策略兼容旧版本（修复 CMP0167 警告）
          :: 3. 全功能开启，仅禁用测试和示例
          echo "正在配置 CMake..."
          cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_TOOLCHAIN_FILE=%VCPKG_TOOLCHAIN% ^
          -DVCPKG_TARGET_TRIPLET=x64-windows-static ^
          -DCMAKE_POLICY_VERSION_MINIMUM=3.20 ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DTORRENT_BUILD_SHARED=OFF ^
          -DTORRENT_BUILD_TESTS=OFF ^
          -DTORRENT_BUILD_EXAMPLES=OFF ^
          -DBoost_USE_STATIC_LIBS=ON
          
          if %errorlevel% neq 0 (
              echo CMake 配置失败！
              exit /b 1
          )
          echo CMake 配置成功！

      - name: 编译（Release x64）
        run: |
          cd /d D:\libtorrent-work\libtorrent-rasterbar-2.0.12\build
          
          echo "正在编译（多核加速）..."
          msbuild libtorrent.sln /p:Configuration=Release /p:Platform=x64 /m
          
          if %errorlevel% neq 0 (
              echo 编译失败！
              exit /b 1
          )
          echo 编译成功！

      - name: 收集编译产物
        run: |
          cd /d D:\libtorrent-work
          mkdir dist
          mkdir dist\include
          mkdir dist\lib
          
          :: 复制头文件
          echo "正在复制头文件..."
          xcopy /E /I /Y "libtorrent-rasterbar-2.0.12\include" "dist\include"
          
          :: 复制静态库
          echo "正在复制库文件..."
          copy /Y "libtorrent-rasterbar-2.0.12\build\src\Release\libtorrent-rasterbar.lib" "dist\lib\"
          
          :: 复制 Boost 头文件（可选，避免项目中找不到 Boost）
          echo "正在复制 Boost 头文件..."
          xcopy /E /I /Y "%VCPKG_ROOT%\installed\x64-windows-static\include" "dist\include"
          
          echo.
          echo "=== 产物目录结构 ==="
          dir /s dist

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: libtorrent-rasterbar-2.0.12-full-static-x64-with-boost
          path: D:\libtorrent-work\dist\
          retention-days: 30

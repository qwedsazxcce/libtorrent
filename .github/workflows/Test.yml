name: Build libtorrent-rasterbar 2.0.12

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd

    steps:
      - name: Check env
        run: |
          cmake --version
          msbuild -version

      - name: Install vcpkg & boost
        run: |
          cd /d D:\
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          call bootstrap-vcpkg.bat
          vcpkg install boost:x64-windows-static
          echo VCPKG_TOOLCHAIN=D:\vcpkg\scripts\buildsystems\vcpkg.cmake>>%GITHUB_ENV%

      - name: Download & extract libtorrent
        run: |
          mkdir D:\lt
          cd /d D:\lt
          powershell Invoke-WebRequest -Uri "https://github.com/arvidn/libtorrent/releases/download/v2.0.12/libtorrent-rasterbar-2.0.12.tar.gz" -OutFile lt.tar.gz
          tar xzf lt.tar.gz

      - name: CMake generate
        run: |
          cd /d D:\lt\libtorrent-rasterbar-2.0.12
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_TOOLCHAIN_FILE=%VCPKG_TOOLCHAIN% ^
          -DVCPKG_TARGET_TRIPLET=x64-windows-static ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DTORRENT_BUILD_SHARED=OFF ^
          -DTORRENT_BUILD_TESTS=OFF ^
          -DTORRENT_BUILD_EXAMPLES=OFF ^
          -DBoost_USE_STATIC_LIBS=ON

      - name: Build
        run: |
          cd /d D:\lt\libtorrent-rasterbar-2.0.12\build
          msbuild libtorrent.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Package output
        run: |
          cd /d D:\lt
          mkdir out\include
          mkdir out\lib
          xcopy /E /Y libtorrent-rasterbar-2.0.12\include out\include\
          copy /Y libtorrent-rasterbar-2.0.12\build\src\Release\libtorrent-rasterbar.lib out\lib\

      - uses: actions/upload-artifact@v4
        with:
          name: libtorrent-2.0.12-static-x64
          path: D:\lt\out\

      - name: Configure CMake (Full Feature Static Library)
        shell: powershell
        run: |
          $SRC_DIR = "$env:WORK_DIR\libtorrent-rasterbar-$env:LIBTORRENT_VERSION"
          $BUILD_DIR = "$SRC_DIR\build"
          
          New-Item -ItemType Directory -Force -Path $BUILD_DIR | Out-Null
          Set-Location $BUILD_DIR
          
          Write-Host "=== Configuring CMake for full feature static library ==="
          cmake .. -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_TOOLCHAIN" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TARGET_TRIPLET" `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.20 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DBUILD_SHARED_LIBS=OFF `
            -DTORRENT_BUILD_SHARED_LIBS=OFF `
            -DTORRENT_USE_STATIC_RUNTIME=ON `
            -DTORRENT_BUILD_TESTS=OFF `
            -DTORRENT_BUILD_EXAMPLES=OFF `
            -DBoost_USE_STATIC_LIBS=ON `
            -DBoost_USE_STATIC_RUNTIME=ON `
            # ===================== 全功能核心参数（显式开启所有功能） =====================
            -DTORRENT_USE_LPTP=ON `
            -DTORRENT_USE_DHT=ON `
            -DTORRENT_USE_ENCRYPTION=ON `
            -DTORRENT_USE_IPV6=ON `
            -DTORRENT_USE_UPNP=ON `
            -DTORRENT_USE_WEBSEEDS=ON `
            -DTORRENT_USE_SUPER_SEEDING=ON `
            -DTORRENT_ENABLE_LOGGING=ON `
            -DTORRENT_DISK_STATS=ON `
            -DTORRENT_BANDWIDTH_MANAGEMENT=ON `
            -DTORRENT_USE_RSS=ON `
            -DTORRENT_USE_METADATA_EXTENSIONS=ON `
            -DTORRENT_USE_GEO_IP=ON `
            -DTORRENT_USE_PROXY=ON `
            -DTORRENT_USE_ASYNC_IO=ON `
            -DTORRENT_USE_DISK_CACHE=ON `
            -DTORRENT_USE_INVARIANT_CHECKS=OFF `
            -DTORRENT_OPTIMIZE_FOR_SIZE=OFF `
            -DTORRENT_USE_ASSERTS=OFF
          
          if ($LASTEXITCODE -ne 0) {
              Write-Error "CMake configuration failed!"
              exit 1
          }
          Write-Host "=== CMake configured successfully ==="

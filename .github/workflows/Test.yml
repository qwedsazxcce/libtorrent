name: Build libtorrent-rasterbar 2.0.12 (Full Feature Static Library)

on:
  push:
    branches:
      - RC_2_0
    paths:
      - '.github/workflows/Test.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_TOOLCHAIN: ${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake
      VCPKG_TARGET_TRIPLET: x64-windows-static
      LIBTORRENT_VERSION: 2.0.12
      WORK_DIR: ${{ github.workspace }}\libtorrent-work

    steps:
      - name: 显示环境信息
        run: |
          echo "=== 检查 CMake 版本 ==="
          cmake --version
          echo.
          echo "=== 检查 MSBuild 版本 ==="
          msbuild -version
          echo.
          echo "=== 当前工作目录 ==="
          cd
          echo "=== GitHub 工作空间 ==="
          echo %GITHUB_WORKSPACE%

      - name: 配置 vcpkg 全局缓存
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: |
            ${{ env.VCPKG_ROOT }}\downloads
            ${{ env.VCPKG_ROOT }}\installed
          key: ${{ runner.os }}-vcpkg-${{ env.VCPKG_TARGET_TRIPLET }}-boost-20260304
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ env.VCPKG_TARGET_TRIPLET }}-

      - name: 安装 vcpkg 并配置 Boost 依赖
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "%VCPKG_ROOT%"
          cd /d "%VCPKG_ROOT%"
          git checkout 2026.03.04
          
          call bootstrap-vcpkg.bat -disableMetrics
          
          :: 配置 GitHub 镜像解决 502 错误
          set VCPKG_ASSET_SOURCES=x-azurl,https://mirror.ghproxy.com/https://github.com/,blocking
          
          :: 仅安装必需的 Boost 组件
          echo "正在安装 Boost 必需组件..."
          .\vcpkg install ^
            boost-asio:%VCPKG_TARGET_TRIPLET% ^
            boost-chrono:%VCPKG_TARGET_TRIPLET% ^
            boost-system:%VCPKG_TARGET_TRIPLET% ^
            boost-thread:%VCPKG_TARGET_TRIPLET% ^
            boost-random:%VCPKG_TARGET_TRIPLET% ^
            boost-iterator:%VCPKG_TARGET_TRIPLET% ^
            boost-core:%VCPKG_TARGET_TRIPLET% ^
            boost-config:%VCPKG_TARGET_TRIPLET% ^
            boost-utility:%VCPKG_TARGET_TRIPLET%
          
          if %errorlevel% neq 0 (
              echo vcpkg 依赖安装失败！
              exit /b 1
          )
          echo vcpkg 依赖安装成功！

      - name: 创建工作目录并下载 libtorrent 源码
        run: |
          :: 创建工作目录
          mkdir "%WORK_DIR%"
          cd /d "%WORK_DIR%"
          
          :: 修复核心：PowerShell 命令用正确转义，避免 cmd 解析内部语法
          echo "正在下载 libtorrent v%LIBTORRENT_VERSION% 源码（带重试）..."
          powershell -Command "& {
              $url = 'https://github.com/arvidn/libtorrent/releases/download/v${env:LIBTORRENT_VERSION}/libtorrent-rasterbar-${env:LIBTORRENT_VERSION}.tar.gz';
              $output = 'libtorrent.tar.gz';
              $retryCount = 3;
              $success = $false;
              while ($retryCount -gt 0 -and !$success) {
                  try {
                      Write-Host '下载尝试: ' (4 - $retryCount);
                      Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing -TimeoutSec 30;
                      $success = $true;
                  } catch {
                      Write-Host '下载失败，剩余重试次数: ' ($retryCount - 1);
                      $retryCount--;
                      Start-Sleep -Seconds 5;
                  }
              }
              if (!$success) {
                  Write-Error '所有重试均失败！';
                  exit 1;
              }
          }"
          
          if %errorlevel% neq 0 (
              echo 源码下载失败！
              exit /b 1
          )
          
          :: 解压源码
          echo "正在解压源码..."
          tar -xzf libtorrent.tar.gz
          
          echo "=== 解压后的目录 ==="
          dir

      - name: 配置 CMake
        run: |
          set SRC_DIR=%WORK_DIR%\libtorrent-rasterbar-%LIBTORRENT_VERSION%
          set BUILD_DIR=%SRC_DIR%\build
          
          mkdir "%BUILD_DIR%"
          cd /d "%BUILD_DIR%"
          
          echo "正在配置 CMake..."
          cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_TOOLCHAIN_FILE="%VCPKG_TOOLCHAIN%" ^
          -DVCPKG_TARGET_TRIPLET=%VCPKG_TARGET_TRIPLET% ^
          -DCMAKE_POLICY_VERSION_MINIMUM=3.20 ^
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DTORRENT_BUILD_SHARED_LIBS=OFF ^
          -DTORRENT_USE_STATIC_RUNTIME=ON ^
          -DTORRENT_BUILD_TESTS=OFF ^
          -DTORRENT_BUILD_EXAMPLES=OFF ^
          -DBoost_USE_STATIC_LIBS=ON ^
          -DBoost_USE_STATIC_RUNTIME=ON
          
          if %errorlevel% neq 0 (
              echo CMake 配置失败！
              exit /b 1
          )
          echo CMake 配置成功！

      - name: 编译 Release 版本
        run: |
          set BUILD_DIR=%WORK_DIR%\libtorrent-rasterbar-%LIBTORRENT_VERSION%\build
          cd /d "%BUILD_DIR%"
          
          echo "正在编译 Release x64 版本..."
          msbuild libtorrent.sln /p:Configuration=Release /p:Platform=x64 /m /p:UseMultiToolTask=true /p:EnforceProcessCountAcrossBuilds=true
          
          if %errorlevel% neq 0 (
              echo 编译失败！
              exit /b 1
          )
          echo 编译成功！

      - name: 收集编译产物
        run: |
          set DIST_DIR=%WORK_DIR%\dist
          mkdir "%DIST_DIR%"
          mkdir "%DIST_DIR%\include"
          mkdir "%DIST_DIR%\lib"
          
          :: 复制 libtorrent 头文件
          xcopy /E /I /Y "%WORK_DIR%\libtorrent-rasterbar-%LIBTORRENT_VERSION%\include" "%DIST_DIR%\include"
          
          :: 复制静态库
          copy /Y "%WORK_DIR%\libtorrent-rasterbar-%LIBTORRENT_VERSION%\build\src\Release\libtorrent-rasterbar.lib" "%DIST_DIR%\lib\"
          
          :: 复制 Boost 依赖
          xcopy /E /I /Y "%VCPKG_ROOT%\installed\%VCPKG_TARGET_TRIPLET%\include" "%DIST_DIR%\include"
          xcopy /E /I /Y "%VCPKG_ROOT%\installed\%VCPKG_TARGET_TRIPLET%\lib" "%DIST_DIR%\lib"
          
          echo.
          echo "=== 最终产物目录结构 ==="
          dir /s "%DIST_DIR%"

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: libtorrent-rasterbar-${{ env.LIBTORRENT_VERSION }}-full-static-x64-with-boost
          path: ${{ env.WORK_DIR }}\dist\
          retention-days: 30
